<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>文天玩WenTianPlay官方权威域名</title><style>body{margin:0;padding:0;background:#0a0e17;color:#fff;font-family:Arial, sans-serif;min-height:100vh}.stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;pointer-events:none}.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite alternate}@keyframes twinkle{0%,100%{opacity:0.2}50%{opacity:1}}.container{max-width:1200px;margin:0 auto;padding:20px}.header{text-align:center;margin-bottom:40px;padding:20px 0}.title{font-size:2.5em;color:#00ff00;margin-bottom:10px;text-shadow:0 0 10px rgba(0,255,0,0.5)}.current-time{font-size:1.2em;color:#ff0000;background:rgba(0,0,0,0.3);padding:10px 20px;border-radius:10px;display:inline-block}.domain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:20px}.domain-card{background:rgba(255,255,255,0.05);border:1px solid rgba(0,255,0,0.1);border-radius:15px;padding:25px;transition:all 0.3s ease}.domain-card:hover{background:rgba(255,255,255,0.08);border-color:rgba(0,255,0,0.3);transform:translateY(-5px)}.domain-name{font-size:1.5em;color:#00ff00;margin-bottom:15px;display:flex;align-items:center;gap:10px}.domain-name::before{content:"🌐"}.time-display{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.time-unit{text-align:center;padding:15px 5px;background:rgba(0,0,0,0.3);border-radius:10px;border:1px solid rgba(255,255,255,0.1)}.time-number{font-size:2em;font-weight:bold;color:#00ff00;display:block;line-height:1}.time-label{font-size:0.9em;color:#88ff88;margin-top:5px}.domain-info{display:flex;justify-content:space-between;margin-top:15px;font-size:0.9em;color:#888}.registration-date{background:rgba(0,0,0,0.2);padding:5px 10px;border-radius:5px}.total-days{color:#00ff00;font-weight:bold}@media (max-width:768px){.domain-grid{grid-template-columns:1fr}.time-display{grid-template-columns:repeat(2,1fr)}.time-number{font-size:1.5em}.title{font-size:2em}}</style></head><body><div class="stars" id="stars"></div><div class="container"><div class="header"><h1 class="title">文天玩官方权威域名</h1><div class="current-time" id="currentTime"></div></div><div class="domain-grid" id="domainGrid"></div></div><script>function createStars(){const starsContainer=document.getElementById('stars');for(let i=0;i<150;i++){const star=document.createElement('div');star.className='star';const size=Math.random()*2+1;star.style.width=`${size}px`;star.style.height=`${size}px`;star.style.left=`${Math.random()*100}%`;star.style.top=`${Math.random()*100}%`;star.style.opacity=Math.random()*0.6+0.4;star.style.animationDelay=`${Math.random()*2}s`;starsContainer.appendChild(star)}}function calculateTimeDiff(startTime){const now=new Date();const start=new Date(startTime);const diff=now-start;const totalSeconds=Math.floor(diff/1000);const days=Math.floor(totalSeconds/(3600*24));const hours=Math.floor((totalSeconds%(3600*24))/3600);const minutes=Math.floor((totalSeconds%3600)/60);const seconds=totalSeconds%60;const totalDays=(diff/(1000*3600*24)).toFixed(2);return{days,hours,minutes,seconds,totalDays}}function formatTimeUnit(unit){return unit<10?`0${unit}`:unit.toString()}function updateCurrentTime(){const now=new Date();const dateStr=now.toLocaleDateString('zh-CN');const timeStr=now.toLocaleTimeString('zh-CN',{hour12:false});document.getElementById('currentTime').textContent=`当前时间: ${dateStr} ${timeStr}`}function createDomainCard(domain){const time=calculateTimeDiff(domain.startTime);const card=document.createElement('div');card.className='domain-card';card.innerHTML=`<div class="domain-name">${domain.name}</div><div class="time-display"><div class="time-unit"><span class="time-number">${formatTimeUnit(time.days)}</span><span class="time-label">天</span></div><div class="time-unit"><span class="time-number">${formatTimeUnit(time.hours)}</span><span class="time-label">小时</span></div><div class="time-unit"><span class="time-number">${formatTimeUnit(time.minutes)}</span><span class="time-label">分钟</span></div><div class="time-unit"><span class="time-number">${formatTimeUnit(time.seconds)}</span><span class="time-label">秒</span></div></div><div class="domain-info"><div class="registration-date">注册时间: ${new Date(domain.startTime).toLocaleDateString('zh-CN')}</div><div class="total-days">已运行时间: ${time.totalDays} 天</div></div>`;return card}function loadDomains(){fetch('https://api.wentianplay.com/api/dns.json').then(response=>response.json()).then(data=>{const grid=document.getElementById('domainGrid');grid.innerHTML='';data.domains.forEach(domain=>{const card=createDomainCard(domain);grid.appendChild(card)})}).catch(error=>{console.error('加载域名数据失败:',error);document.getElementById('domainGrid').innerHTML='<div class="error">加载失败，请检查网络连接</div>'})}createStars();updateCurrentTime();loadDomains();setInterval(updateCurrentTime,1000);setInterval(loadDomains,1000);</script></body></html>
